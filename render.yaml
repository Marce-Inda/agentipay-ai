services:
  - type: web
    name: agentic-pay-ai
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-pay-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: APP_ORIGIN
        sync: false
      - key: REGISTRATION_INVITE_CODE
        sync: false
    healthCheckPath: /

databases:
  - name: agentic-pay-db
    plan: free
    databaseName: agenticpay
    postgresMajorVersion: "16"
